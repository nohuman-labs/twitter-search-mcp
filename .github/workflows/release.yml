name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  metadata:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: version
        name: Require the tag to match package.json
        run: |
          version="$(node -p \"JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version\")"
          test "$GITHUB_REF_NAME" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Test (Node ${{ matrix.node }})
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Create credential-free configuration
        run: cp mcp.config.example.yaml mcp.config.yaml
      - run: make check
      - run: make build
      - run: npm run generate:config
      - name: Validate generated Cloudflare configuration
        run: npx wrangler deploy --dry-run --config .generated/wrangler.jsonc
      - name: Inspect release package
        run: npm pack --dry-run --json

  container:
    name: Container and Kubernetes
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f deploy/docker/Dockerfile -t twitter-search-mcp:release-test .
      - run: sh tests/container-smoke.sh twitter-search-mcp:release-test
      - run: kubectl kustomize deploy/kubernetes/overlays/example >/dev/null

  publish:
    name: Publish npm, container image, and GitHub Release
    needs: [metadata, test, container]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Inspect the built release package
        run: npm pack --dry-run --ignore-scripts --json
      - name: Check whether this release version already exists
        run: |
          package_name="$(node -p \"JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).name\")"
          package_version="$(node -p \"JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version\")"
          set +e
          result="$(npm view "$package_name@$package_version" version --json 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "$result"
            echo "::error title=npm package version already published::$package_name@$package_version already exists. Bump package.json before releasing."
            exit 1
          fi
          if ! printf '%s' "$result" | grep -q 'E404'; then
            echo "$result"
            echo "::error title=npm version check failed::Refusing to publish without a confirmed E404 response for $package_name@$package_version."
            exit 1
          fi
      - name: Publish npm package with provenance
        run: |
          if ! npm publish --provenance --access public --ignore-scripts; then
            echo "::error title=npm publish rejected::If this is the first release and the unscoped name is owned by another publisher, change package.json to @${GITHUB_REPOSITORY_OWNER}/twitter-search-mcp before retrying."
            exit 1
          fi
      - id: image
        name: Define immutable GHCR image name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/twitter-search-mcp" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.metadata.outputs.version }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
      - name: Create GitHub Release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          changelog="$(awk -v version="$VERSION" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"
          test -n "$changelog"
          {
            echo "## Changelog"
            printf '%s\n' "$changelog"
            echo
            echo "## Container image"
            printf '`%s@%s`\n' "$IMAGE" "$DIGEST"
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
