name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: version
        name: Require the tag to match package.json
        run: |
          version="$(node -p \"JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version\")"
          test "$GITHUB_REF_NAME" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Test (Node ${{ matrix.node }})
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Create credential-free configuration
        run: cp mcp.config.example.yaml mcp.config.yaml
      - run: make check
      - run: make build
      - run: npm run generate:config
      - name: Validate generated Cloudflare configuration
        run: npx wrangler deploy --dry-run --config .generated/wrangler.jsonc
      - name: Inspect release package
        run: npm pack --dry-run --json

  container:
    name: Container and Kubernetes
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f deploy/docker/Dockerfile -t twitter-search-mcp:release-test .
      - run: sh tests/container-smoke.sh twitter-search-mcp:release-test
      - run: kubectl kustomize deploy/kubernetes/overlays/example >/dev/null

  publish:
    name: Publish npm, container image, and GitHub Release
    needs: [metadata, test, container]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Inspect the built release package
        run: npm pack --dry-run --ignore-scripts --json
      - id: npm_state
        name: Resolve npm publication state
        run: |
          package_name="$(node -p \"JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).name\")"
          package_version="$(node -p \"JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version\")"
          sh scripts/release-state.sh npm "$package_name" "$package_version"
      - name: Publish npm package with provenance
        if: steps.npm_state.outputs.publish == 'true'
        run: |
          if ! npm publish --provenance --access public --ignore-scripts; then
            echo "::error title=npm publish rejected::If this is the first release and the unscoped name is owned by another publisher, change package.json to @${GITHUB_REPOSITORY_OWNER}/twitter-search-mcp before retrying."
            exit 1
          fi
      - id: image
        name: Define immutable GHCR image name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/twitter-search-mcp" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image_state
        name: Resolve existing GHCR tags
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ needs.metadata.outputs.version }}
          SHA_TAG: ${{ github.sha }}
        run: sh scripts/release-state.sh image "$IMAGE" "$VERSION" "$SHA_TAG"
      - name: Restore a missing GHCR tag
        if: steps.image_state.outputs.repair == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.image_state.outputs.digest }}
          MISSING_TAG: ${{ steps.image_state.outputs.missing_tag }}
        run: docker buildx imagetools create --tag "$MISSING_TAG" "$IMAGE@$DIGEST"
      - id: build
        name: Build and publish a new GHCR image
        if: steps.image_state.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.metadata.outputs.version }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
      - id: image_digest
        name: Record the immutable GHCR digest
        env:
          EXISTING_DIGEST: ${{ steps.image_state.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          digest="$EXISTING_DIGEST"
          if [ -z "$digest" ]; then digest="$BUILT_DIGEST"; fi
          case "$digest" in
            sha256:*) ;;
            *) echo "::error title=Missing GHCR digest::Release image has no immutable digest."; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.image_digest.outputs.digest }}
        run: |
          changelog="$(awk -v version="$VERSION" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"
          test -n "$changelog"
          {
            echo "## Changelog"
            printf '%s\n' "$changelog"
            echo
            echo "## Container image"
            printf '`%s@%s`\n' "$IMAGE" "$DIGEST"
          } > release-notes.md
          sh scripts/release-state.sh release "$GITHUB_REF_NAME" release-notes.md
