apiVersion: apps/v1
kind: Deployment
metadata:
  name: twitter-search-mcp
  labels:
    app.kubernetes.io/name: twitter-search-mcp
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: twitter-search-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: twitter-search-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: twitter-search-mcp
          image: twitter-search-mcp:latest
          imagePullPolicy: IfNotPresent
          command: ["node"]
          args:
            - dist/runtimes/node.js
            - --config
            - /config/mcp.config.yaml
            - --host
            - 0.0.0.0
            - --port
            - "3000"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: twitter-search-mcp-config
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
