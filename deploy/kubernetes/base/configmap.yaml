# This configuration intentionally contains no credentials. To enable X or bearer
# access, replace this ConfigMap volume with a Secret volume that provides the
# complete mcp.config.yaml file; do not inject individual tokens through env vars.
apiVersion: v1
kind: ConfigMap
metadata:
  name: twitter-search-mcp-config
data:
  mcp.config.yaml: |
    version: 1
    access:
      mode: anonymous
      token: ""
    search:
      default_provider: twitee
      allow_provider_override: false
    providers:
      twitee:
        enabled: true
        base_url: https://twitee.co
        token: ""
      x:
        enabled: false
        base_url: https://api.x.com
        token: ""
    ratelimit:
      enabled: true
      limit: 60
      window: 1m
